services:
  - type: web
    name: kingmyco-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:api:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: KINGMYCO_STATE_PATH
        value: data/kingmyco-state.json

  - type: worker
    name: kingmyco-heartbeat-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:heartbeat-worker:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: KINGMYCO_STATE_PATH
        value: data/kingmyco-state.json

  - type: worker
    name: kingmyco-settlement-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:settlement-worker:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: KINGMYCO_STATE_PATH
        value: data/kingmyco-state.json
